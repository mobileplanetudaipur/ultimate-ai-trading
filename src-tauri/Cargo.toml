[package]
name = "ultimate-ai-trading"
version = "1.0.0"
description = "Local paper-trading research dashboard"
authors = ["mobileplanetudaipur"]
license = "UNLICENSED"
repository = "https://github.com/mobileplanetudaipur/aitrading"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde_json = "1"
